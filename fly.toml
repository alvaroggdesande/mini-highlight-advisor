# Fly.io config — run `fly launch` once to register the app, then `fly deploy`.
# Update `app` to match the name Fly assigns (must be globally unique).
app = "mini-highlight-advisor"
primary_region = "lhr"

[build]

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
